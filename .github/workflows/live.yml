name: PIDS YouTube Live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pids-youtube-live
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_URL: "https://transitapp-6c6.pages.dev/pids"
      YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      VIDEO_WIDTH: "1920"
      VIDEO_HEIGHT: "1080"
      FPS: "30"
      SESSION_MINUTES: "355"
      PLAYWRIGHT_VERSION: "1.56.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restore the newest cache for this OS and Playwright version.
      # Each run saves under a unique key to avoid concurrent key reservations.
      - name: Restore browser cache
        uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local/pids-live
            ~/.local/share/fonts
          key: pids-live-ubuntu-24-playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pids-live-ubuntu-24-playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-

      - name: Install Playwright and Chromium (cache miss only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.local/pids-live/node_modules/.bin/playwright" ]]; then
            npm install --prefix "$HOME/.local/pids-live" "playwright@${PLAYWRIGHT_VERSION}"
          fi

          PLAYWRIGHT="$HOME/.local/pids-live/node_modules/.bin/playwright"
          CHROME_PATH="$(node -e "console.log(require('$HOME/.local/pids-live/node_modules/playwright').chromium.executablePath())")"

          if [[ ! -x "$CHROME_PATH" ]]; then
            "$PLAYWRIGHT" install chromium
          else
            echo "Using cached Chromium: $CHROME_PATH"
          fi

          # Install only missing system dependencies; Ubuntu runner images
          # normally already include FFmpeg and Xvfb.
          MISSING=()
          command -v ffmpeg >/dev/null 2>&1 || MISSING+=(ffmpeg)
          command -v Xvfb >/dev/null 2>&1 || MISSING+=(xvfb)
          command -v pulseaudio >/dev/null 2>&1 || MISSING+=(pulseaudio)
          command -v pactl >/dev/null 2>&1 || MISSING+=(pulseaudio-utils)
          if (( ${#MISSING[@]} )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${MISSING[@]}"
          fi

          # Ensure Chromium has a Traditional Chinese font available.
          mkdir -p "$HOME/.local/share/fonts"
          if ! fc-list :lang=zh-tw family 2>/dev/null | grep -qi "Noto Sans CJK"; then
            echo "Installing Noto CJK fonts for Chinese text."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            mkdir -p "$HOME/.local/share/fonts/noto-cjk"
            cp -a /usr/share/fonts/opentype/noto/. "$HOME/.local/share/fonts/noto-cjk/"
          else
            echo "Traditional Chinese fonts are available."
          fi
          fc-cache -f "$HOME/.local/share/fonts"
          fc-list :lang=zh-tw family | head -10

          # Only run Playwright's APT dependency installer when Chromium
          # actually has unresolved shared-library dependencies.
          if ldd "$CHROME_PATH" 2>/dev/null | grep -q "not found"; then
            echo "Missing Chromium shared libraries; installing dependencies."
            "$PLAYWRIGHT" install-deps chromium
          else
            echo "Chromium shared-library dependencies are already present."
          fi

      # Save immediately after browser setup so cancelling the long stream
      # does not prevent the cache from being persisted.
      - name: Save browser cache
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local/pids-live
            ~/.local/share/fonts
          key: pids-live-ubuntu-24-playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start browser capture and stream
        run: bash ./scripts/stream.sh

      - name: Show diagnostics
        if: always()
        run: |
          echo "Workflow finished at $(date -u)"
          pgrep -a chrome || true
          pgrep -a ffmpeg || true
